<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#252526">
<title>Plan Editor</title>
<style>
  :root { --bg:#1e1e1e; --panel:#252526; --line:#3c3c3c; --fg:#d4d4d4; --dim:#8b8b8b; --accent:#0e7ad1; --ok:#4ec9b0; --warn:#d7ba7d; --err:#f48771; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { height:100%; margin:0; }
  body { height:100dvh; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,sans-serif; display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); -webkit-tap-highlight-color:transparent; }
  header { position:relative; display:flex; gap:6px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:13px; margin:0 8px 0 0; }
  #current { color:var(--dim); margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #actions { display:contents; }
  #menu, #tabbar { display:none; }
  #current b { color:var(--fg); }
  button { background:#333; color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover:not(:disabled) { background:#3d3d3d; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger:hover:not(:disabled) { background:#7a2b22; }
  #dlgOk.danger { background:#7a2b22; border-color:#7a2b22; color:#fff; }
  main { display:grid; grid-template-columns:240px 1fr 300px; min-height:0; }
  aside { background:var(--panel); overflow:auto; min-height:0; overscroll-behavior:contain; }
  #files { border-right:1px solid var(--line); }
  #side { border-left:1px solid var(--line); }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0; padding:10px 10px 4px; }
  .file { padding:5px 10px; cursor:pointer; border-left:2px solid transparent; }
  .file:hover { background:#2d2d2e; }
  .file.active { background:#37373d; border-left-color:var(--accent); }
  .file small { display:block; color:var(--dim); }
  #editor { min-width:0; min-height:0; }
  .row { display:flex; gap:6px; align-items:center; padding:4px 10px; border-bottom:1px solid #2f2f2f; }
  .row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .row .name:hover { text-decoration:underline; }
  .row small { color:var(--dim); }
  .row button { padding:1px 6px; }
  .msg { padding:2px 10px; }
  .msg.err { color:var(--err); } .msg.warn { color:var(--warn); } .msg.ok { color:var(--ok); }
  #toast { position:fixed; bottom:calc(14px + var(--tabbar-h, 0px) + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:#333; border:1px solid var(--line); padding:8px 14px; border-radius:4px; display:none; max-width:80vw; }
  .empty { color:var(--dim); padding:10px; }
  button.garmin { border-color:#4a6a8a; }
  button.garmin:hover:not(:disabled) { background:#27425e; }
  select, input[type="search"] { background:#333; color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:4px 6px; font:inherit; }
  /* ── Plan view: is each workout up to date on Garmin? ── */
  .chip { font-size:11px; line-height:16px; padding:0 7px; border-radius:9px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; flex:none; }
  .chip.ok { color:var(--ok); border-color:#2d6a5c; } .chip.warn { color:var(--warn); border-color:#7a6a3d; } .chip.err { color:var(--err); border-color:#8a4a40; }
  button.chip { background:none; padding:0 7px; cursor:pointer; }
  button.chip:hover:not(:disabled) { background:#333; }
  #syncbar { display:flex; align-items:center; gap:6px; padding:4px 10px; color:var(--dim); }
  #syncbar[hidden] { display:none; }
  #syncbar span { flex:1; min-width:0; }
  #syncbar button { padding:1px 6px; }

  /* ── Workouts view: the Garmin library, next to the plan workouts, with CRUD ── */
  #views { display:flex; }
  #views button { border-radius:0; }
  #views button:first-child { border-radius:3px 0 0 3px; } #views button:last-child { border-radius:0 3px 3px 0; margin-left:-1px; }
  #views button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  body[data-view="workouts"] :is(#save, #actions, #current, #menu, main, #tabbar) { display:none !important; }
  body:not([data-view="workouts"]) #wview { display:none; }
  #wview { display:grid; grid-template-columns:380px 1fr; min-height:0; }
  #wlist, #wdetail { display:flex; flex-direction:column; min-height:0; min-width:0; }
  #wlist { background:var(--panel); border-right:1px solid var(--line); }
  .wbar { display:flex; gap:6px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  .wbar input[type="search"] { flex:1; min-width:0; }
  .wbar b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .only-mobile { display:none; }
  #wNote { padding:0 10px; }
  #wrows, #wbody { flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; }
  .wrow { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 8px; padding:7px 10px; cursor:pointer; border-left:2px solid transparent; border-bottom:1px solid #2f2f2f; }
  .wrow:hover { background:#2d2d2e; }
  .wrow.active { background:#37373d; border-left-color:var(--accent); }
  .wrow .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wrow small { grid-column:1; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; align-self:center; }
  .wact { grid-column:2; display:flex; gap:2px; justify-self:end; }
  .wact button { background:none; border:0; padding:3px 5px; line-height:0; color:var(--dim); }
  .wact button:hover:not(:disabled) { background:#3d3d3d; color:var(--fg); }
  .wact button.danger:hover:not(:disabled) { background:#7a2b22; color:#fff; }
  .wact button:disabled { opacity:.25; }
  .wact svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #wbody { padding:12px 16px 24px; }
  #wbody h3 { margin:16px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  #wbody .meta { color:var(--dim); }
  #wbody .banner { margin:12px 0 0; padding:8px 10px; border:1px solid var(--line); border-left-width:3px; border-radius:3px; background:var(--panel); }
  #wbody .banner.ok { border-left-color:var(--ok); } #wbody .banner.warn { border-left-color:var(--warn); } #wbody .banner.err { border-left-color:var(--err); }
  #wbody .banner ul { margin:4px 0 0; padding-left:18px; color:var(--dim); }
  #wbody .banner .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .steps { margin:0; padding-left:0; list-style:none; }
  .steps li { padding:3px 0; border-bottom:1px solid #2a2a2a; }
  .steps li small { color:var(--dim); margin-left:6px; }
  .steps .group { border:1px solid var(--line); border-radius:3px; margin:4px 0; padding:3px 8px 3px 10px; }
  .steps .group > b { color:var(--warn); font-weight:600; }
  .steps .group .steps { padding-left:0; }
  .plans a { color:var(--accent); cursor:pointer; text-decoration:none; } .plans a:hover { text-decoration:underline; }
  .plans div { padding:2px 0; }
  details.plan-version { margin-top:10px; } details.plan-version summary { cursor:pointer; color:var(--dim); }

  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:0; width:min(900px, 96vw); box-shadow:0 12px 40px rgba(0,0,0,.6); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog .dhead { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); }
  dialog .dhead b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  dialog .dbody { padding:10px 12px; }
  dialog .dfoot { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 12px; border-top:1px solid var(--line); }
  dialog .dfoot .spacer { flex:1; }
  dialog label { display:flex; gap:6px; align-items:center; }
  dialog .opts { display:grid; gap:8px; }
  #dlg { width:min(520px, 96vw); }
  #dlgText:not(:empty) { margin-bottom:10px; }
  #wdlg[open] { display:flex; flex-direction:column; height:min(86dvh, 760px); }
  #wdlg .dform { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid var(--line); }
  #wdlg .dform[hidden] { display:none; }
  #wdEditor { flex:1; min-height:0; }
  #wdProblems { max-height:20%; overflow:auto; }
  #activity { padding:0 0 10px; }
  #activity pre { margin:0; padding:4px 10px; white-space:pre-wrap; word-break:break-word; font:12px/1.4 ui-monospace,monospace; color:var(--dim); }

  /* ── Mobile: one pane at a time, switched from a bottom tab bar ── */
  @media (max-width:900px) {
    :root { --tabbar-h:52px; }
    /* Fit the visible area: --vvh/--vvtop follow the visual viewport (set in fitViewport) so an on-screen keyboard doesn't cover the editor. */
    html { overflow:hidden; }
    body { position:fixed; top:0; left:0; width:100%; height:var(--vvh, 100dvh); transform:translateY(var(--vvtop, 0px)); }
    header { padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top)); flex-wrap:nowrap; gap:8px; }
    header h1 { display:none; }
    button { min-height:40px; padding:6px 14px; font-size:14px; }
    #current { flex:1; margin:0; font-size:14px; }
    #menu { display:block; min-width:40px; font-size:20px; line-height:1; padding:0; }
    body.menu-open #menu { background:var(--accent); border-color:var(--accent); color:#fff; }
    #actions { display:none; position:absolute; z-index:10; top:100%; left:0; right:0; padding:10px; gap:8px; grid-template-columns:1fr 1fr;
      background:var(--panel); border-bottom:1px solid var(--line); box-shadow:0 8px 16px rgba(0,0,0,.5); }
    body.menu-open #actions { display:grid; max-height:75dvh; overflow:auto; }
    #profile { grid-column:1 / -1; }
    /* iOS zooms the page in when a field under 16px gets focus; Monaco's hidden textarea inherits the editor's 14px. */
    select, input[type="search"], .monaco-editor .inputarea { min-height:40px; font-size:16px !important; }
    .monaco-editor .inputarea { min-height:0; }
    #activity pre { padding:4px 12px; font-size:12px; }

    main { display:block; position:relative; overflow:hidden; }
    #files, #editor, #side { width:100%; height:100%; border:0; }
    body:not([data-tab="files"]) #files,
    body:not([data-tab="editor"]) #editor,
    body[data-tab="files"] #side, body[data-tab="editor"] #side { display:none; }
    body[data-tab="outline"] #problemsPane, body[data-tab="problems"] #outlinePane { display:none; }
    aside h2 { padding:14px 12px 6px; font-size:12px; }
    #side h2 { display:none; }
    .file { padding:12px 14px; font-size:15px; border-bottom:1px solid #2f2f2f; }
    .file small { font-size:12px; margin-top:2px; }
    .row { padding:8px 12px; gap:8px; flex-wrap:wrap; min-height:48px; }
    .row .name { flex:1 1 30%; font-size:15px; }
    .row small { order:3; flex-basis:100%; margin-top:-4px; }
    .row button { min-width:44px; min-height:40px; padding:0 10px; font-size:16px; }
    .msg { padding:8px 12px; font-size:14px; }
    .empty { padding:16px 12px; font-size:14px; }
    #toast { max-width:92vw; font-size:14px; }

    #views { display:none; }
    body[data-view="workouts"] #views { display:flex; }
    body[data-view="workouts"] header { justify-content:center; }
    #views button { min-width:96px; }
    #wview { display:block; position:relative; overflow:hidden; }
    #wlist, #wdetail { width:100%; height:100%; border:0; }
    body:not([data-wpane="detail"]) #wdetail, body[data-wpane="detail"] #wlist { display:none; }
    .only-mobile { display:inline-block; min-width:40px; padding:0; font-size:20px; line-height:1; }
    .wbar { padding:6px 10px; }
    .wrow { padding:12px 14px; font-size:15px; }
    .wrow small { font-size:12px; }
    .wact button { min-width:40px; min-height:40px; padding:0; }
    .wact svg { width:20px; height:20px; }
    .chip { font-size:12px; }
    .row .chip { min-width:30px; text-align:center; font-size:15px; line-height:22px; }
    #wbody { padding:12px 14px 24px; font-size:15px; }
    #wdlg[open] { width:100vw; max-width:100vw; height:var(--vvh, 100dvh); max-height:var(--vvh, 100dvh); top:var(--vvtop, 0px); margin:0; border-radius:0; border:0; }
    #dlg { width:94vw; }

    #tabbar { display:grid; grid-template-columns:repeat(5,1fr); background:var(--panel); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
    #tabbar button { border:0; border-radius:0; background:none; height:var(--tabbar-h); padding:4px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; color:var(--dim); }
    #tabbar button span { font-size:18px; line-height:1; }
    #tabbar button[aria-selected="true"] { color:var(--fg); box-shadow:inset 0 2px 0 var(--accent); }
    #tabbar .badge { font-size:10px; min-width:16px; padding:0 4px; border-radius:8px; background:var(--warn); color:#000; margin-left:4px; }
    #tabbar .badge.err { background:var(--err); }
    #tabbar .badge:empty { display:none; }
    body.kbd #tabbar { display:none; }
  }
</style>
</head>
<body data-view="plans">
<header>
  <h1>Plan Editor</h1>
  <nav id="views" aria-label="View">
    <button id="vPlans" aria-pressed="true">Plans</button>
    <button id="vWorkouts" aria-pressed="false">Workouts</button>
  </nav>
  <button id="save" class="primary" disabled>Save</button>
  <div id="actions">
    <button id="new">+ New</button>
    <button id="validate" disabled>Validate</button>
    <button id="format" disabled>Format</button>
    <button id="reload" disabled>Reload</button>
    <button id="dup" disabled>Duplicate</button>
    <button id="rename" disabled>Rename</button>
    <button id="delete" class="danger" disabled>Delete</button>
    <select id="profile" title="Garmin profile" hidden></select>
    <button id="gUpload" class="garmin" disabled>↑ Upload</button>
    <button id="gSchedule" class="garmin" disabled>📅 Schedule</button>
    <button id="gBoth" class="garmin" disabled>↑📅 Upload + schedule</button>
    <button id="gSend" class="garmin" disabled>⌚ Send to watch</button>
  </div>
  <span id="current">No file open</span>
  <button id="menu" aria-label="More actions" aria-expanded="false">⋯</button>
</header>
<main>
  <aside id="files"></aside>
  <div id="editor"></div>
  <aside id="side">
    <div id="outlinePane">
      <h2>Outline</h2>
      <div id="syncbar" hidden><span id="syncSummary"></span><button id="syncRefresh" title="Check against Garmin again">↻</button></div>
      <div id="outline"><div class="empty">Open a plan.</div></div>
    </div>
    <div id="problemsPane">
      <h2>Validation</h2>
      <div id="problems"><div class="empty">Nothing to report.</div></div>
      <h2>Garmin</h2>
      <div id="activity"><div class="empty">No Garmin action run yet.</div></div>
    </div>
  </aside>
</main>
<section id="wview">
  <div id="wlist">
    <div class="wbar">
      <select id="wProfile" title="Garmin profile" hidden></select>
      <input id="wFilter" type="search" placeholder="Filter workouts" aria-label="Filter workouts">
      <button id="wRefresh" title="Reload from Garmin">↻</button>
      <button id="wNew" class="primary">+ New</button>
    </div>
    <div id="wNote" class="empty" hidden></div>
    <div id="wrows"></div>
  </div>
  <div id="wdetail">
    <div class="wbar">
      <button id="wBackList" class="only-mobile" aria-label="Back to the list">←</button>
      <b id="wTitle">Workout</b>
      <button id="wEdit" disabled>Edit</button>
      <button id="wDelete" class="danger" disabled>Delete</button>
    </div>
    <div id="wbody"><div class="empty">Select a workout.</div></div>
  </div>
</section>
<nav id="tabbar" role="tablist">
  <button role="tab" data-tab="files"><span>📁</span>Files</button>
  <button role="tab" data-tab="editor"><span>✎</span>Editor</button>
  <button role="tab" data-tab="outline"><span>☰</span>Outline</button>
  <button role="tab" data-tab="problems"><span>⚠</span>Checks<b class="badge" id="badge"></b></button>
  <button role="tab" id="tabWorkouts"><span>⌚</span>Workouts</button>
</nav>
<div id="toast"></div>

<dialog id="wdlg">
  <div class="dhead"><b id="wdTitle">Workout</b><button id="wdClose" aria-label="Close">✕</button></div>
  <div class="dform" id="wdPlanRow" hidden><label>Add to plan <select id="wdPlan"></select></label></div>
  <div id="wdEditor"></div>
  <div id="wdProblems"></div>
  <div class="dfoot">
    <label><input type="checkbox" id="wdUpload"><span id="wdUploadLabel">Apply to Garmin</span></label>
    <label id="wdScheduleRow"><input type="checkbox" id="wdSchedule">Re-schedule upcoming dates</label>
    <span class="spacer"></span>
    <button id="wdCancel">Cancel</button>
    <button id="wdSave" class="primary">Save</button>
  </div>
</dialog>
<dialog id="dlg">
  <div class="dhead"><b id="dlgTitle"></b></div>
  <div class="dbody"><div id="dlgText" class="meta"></div><div class="opts" id="dlgOpts"></div></div>
  <div class="dfoot"><span class="spacer"></span><button id="dlgCancel">Cancel</button><button id="dlgOk" class="primary">OK</button></div>
</dialog>

<script src="/vendor/monaco/loader.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const mobileQuery = matchMedia("(max-width: 900px)");

// ── Mobile navigation (tabs + actions menu; the desktop layout ignores both) ──
function setTab(tab) {
  document.body.dataset.tab = tab;
  document.body.classList.remove("menu-open");
  $("menu").setAttribute("aria-expanded", "false");
  document.querySelectorAll("#tabbar button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  if (editor) requestAnimationFrame(() => editor.layout());
  navSync();
}

// ── Size to the visible area ──
// iOS Safari leaves the layout viewport full-height under the on-screen keyboard and scrolls the page instead,
// so the CSS sizes the app from the visual viewport. (Chrome on Android resizes the layout viewport itself.)
const vv = window.visualViewport;
function fitViewport() {
  const root = document.documentElement.style;
  if (!vv || vv.scale > 1.01) { root.removeProperty("--vvh"); root.removeProperty("--vvtop"); return; } // leave a pinch-zoom alone
  root.setProperty("--vvh", vv.height + "px"); root.setProperty("--vvtop", vv.offsetTop + "px");
}
if (vv) { vv.addEventListener("resize", fitViewport); vv.addEventListener("scroll", fitViewport); fitViewport(); }

// ── History: the browser's back button walks through views, tabs, panes and open dialogs ──
// Every entry holds the view/tab/pane it shows and the key of the entry before it; dialogs add an `ov` entry on top.
let navKeyNow = null, navRestoring = false;
const navState = () => ({ view: document.body.dataset.view, tab: document.body.dataset.tab, wpane: document.body.dataset.wpane || "list" });
// The desktop layout shows every pane at once, so only the view is worth a history entry there.
const navKey = (s) => s.view + (mobileQuery.matches ? "/" + (s.view === "plans" ? s.tab : s.wpane) : "");
function navSync() {
  if (navRestoring) return;
  const s = navState(), key = navKey(s);
  if (key === navKeyNow) return;
  // A dialog entry whose dialog has closed is reused rather than left behind.
  const reuse = navKeyNow === null || (history.state && history.state.ov && !document.querySelector("dialog[open]"));
  history[reuse ? "replaceState" : "pushState"]({ ...s, prev: navKeyNow }, "");
  navKeyNow = key;
}
/** Call right after showModal(): Back closes the dialog, and closing it any other way drops its history entry. */
function navDialog(dlg) {
  history.pushState({ ...navState(), prev: navKeyNow, ov: dlg.id }, "");
  dlg.addEventListener("close", () => { if (history.state && history.state.ov === dlg.id) history.back(); }, { once: true });
}
function showWorkoutList() {
  if (document.body.dataset.wpane !== "detail") return;
  const s = history.state;
  if (s && !s.ov && s.prev === navKey({ ...navState(), wpane: "list" })) return history.back(); // the entry we came from
  document.body.dataset.wpane = "list"; navSync();
}
window.addEventListener("popstate", (e) => {
  const s = e.state;
  for (const d of document.querySelectorAll("dialog[open]")) if (!s || s.ov !== d.id) d.close();
  if (!s) return;
  navRestoring = true;
  try {
    if (s.view !== document.body.dataset.view) setView(s.view);
    setTab(s.tab);
    document.body.dataset.wpane = s.wpane === "detail" && !W.selected ? "list" : s.wpane;
  } finally { navRestoring = false; }
  navKeyNow = navKey(navState());
  if (s.ov) history.replaceState({ ...navState(), prev: s.prev }, ""); // forward onto a dialog that is no longer open
});
function toggleMenu() {
  const open = document.body.classList.toggle("menu-open");
  $("menu").setAttribute("aria-expanded", String(open));
}
let editor, monaco;
let files = [];
let current = null;        // { path, mtimeMs }
let savedText = "";
let validateTimer;
let garmin = { enabled: false, profiles: [], defaultProfile: null, reason: null };
let garminBusy = false;
const profileOwner = () => current && (/^data\/([^/]+)\//.exec(current.path) || [])[1];
// The Garmin profile the open plan acts as: its data/<profile>/ owner, else the picker (or the only profile).
const planProfile = () => profileOwner() || (garmin.profiles.length > 1 ? $("profile").value : garmin.profiles[0]);

// ── API ────────────────────────────────────────────────────────────────
async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json", "X-Requested-With": "plan-editor" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { data });
  return data;
}
const fileUrl = (p) => "/api/file?path=" + encodeURIComponent(p);

function toast(text, ms = 3500) {
  const t = $("toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), ms);
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, 6000); } };

// ── File list ──────────────────────────────────────────────────────────
const isDirty = () => current && editor.getValue() !== savedText;

async function refreshFiles() {
  files = (await api("GET", "/api/files")).files;
  const groups = {};
  for (const f of files) (groups[f.path.split("/").slice(0, -1).join("/")] ||= []).push(f);
  const el = $("files"); el.innerHTML = "";
  for (const [dir, list] of Object.entries(groups)) {
    const h = document.createElement("h2"); h.textContent = dir; el.append(h);
    for (const f of list) {
      const d = document.createElement("div");
      d.className = "file" + (current && current.path === f.path ? " active" : "");
      const meta = [f.workoutCount != null ? f.workoutCount + " workouts" : null, f.weekStart].filter(Boolean).join(" · ");
      d.innerHTML = `<span></span><small></small>`;
      d.firstChild.textContent = f.path.split("/").pop();
      d.lastChild.textContent = meta;
      d.onclick = guard(() => openFile(f.path));
      el.append(d);
    }
  }
  if (!files.length) el.innerHTML = '<div class="empty">No plans yet.</div>';
  if (garmin.user && !garmin.user.admin) {
    const who = document.createElement("div"); who.className = "empty"; who.textContent = "Signed in as " + garmin.user.name;
    el.prepend(who);
  }
}

async function openFile(p) {
  if (current && current.path !== p && isDirty() && !confirm("Discard unsaved changes?")) return;
  const f = await api("GET", fileUrl(p));
  current = { path: f.path, mtimeMs: f.mtimeMs };
  setTab("editor");
  savedText = f.text;
  editor.setValue(f.text);
  editor.setScrollTop(0);
  setButtons();
  refreshFiles();
  runValidate();
  refreshSync();
}

function setButtons() {
  const on = !!current;
  for (const id of ["save", "validate", "format", "reload", "dup", "rename", "delete"]) $(id).disabled = !on;
  for (const id of Object.keys(GARMIN_ACTIONS)) {
    $(id).disabled = !on || !garmin.enabled || garminBusy;
    $(id).title = garmin.enabled ? "" : garmin.reason || "Garmin actions are unavailable";
  }
  $("profile").hidden = !(on && garmin.enabled && garmin.profiles.length > 1 && !profileOwner());
  $("current").innerHTML = on ? `<b></b>${isDirty() ? " ●" : ""}` : "No file open";
  if (on) $("current").firstChild.textContent = current.path;
}

// ── Actions ────────────────────────────────────────────────────────────
const save = guard(async () => {
  if (!current) return;
  const text = editor.getValue();
  const r = await api("PUT", fileUrl(current.path), { text, mtimeMs: current.mtimeMs });
  current.mtimeMs = r.mtimeMs; savedText = text;
  showValidation(r.validation); setButtons(); refreshFiles(); refreshSync();
  toast("Saved");
});

const newFile = guard(async () => {
  let name = prompt('New file name (in workout-plans/), or a full path like "data/MED/x.json":', "workouts-new.json");
  if (!name) return;
  if (!/^(workout-plans|data)\//.test(name)) name = "workout-plans/" + name;
  if (!name.endsWith(".json")) name += ".json";
  const today = new Date().toISOString().slice(0, 10);
  const text = JSON.stringify({ generatedAt: new Date().toISOString(), weekStart: today, weekEnd: today, notes: "", workouts: [newWorkout("New workout")] }, null, 2) + "\n";
  await api("PUT", fileUrl(name), { text, create: true });
  await openFile(name);
});

const duplicate = guard(async () => {
  const name = prompt("Duplicate as:", current.path.replace(/\.json$/, "-copy.json"));
  if (!name) return;
  // Strip workoutIds so a copy never overwrites the original workouts on Garmin.
  let text = editor.getValue();
  try {
    const data = JSON.parse(text);
    const list = Array.isArray(data) ? data : data.workouts;
    if (Array.isArray(list) && list.some((w) => w && w.workoutId !== undefined) && confirm("Remove workoutId from the copy? (recommended: re-uploading it would otherwise replace the original workouts on Garmin)")) {
      list.forEach((w) => w && delete w.workoutId);
      text = JSON.stringify(data, null, 2) + "\n";
    }
  } catch {}
  await api("PUT", fileUrl(name), { text, create: true });
  await openFile(name);
});

const rename = guard(async () => {
  const to = prompt("Rename to:", current.path);
  if (!to || to === current.path) return;
  if (isDirty()) await save();
  const r = await api("POST", "/api/rename", { from: current.path, to });
  current.path = r.to; current.mtimeMs = r.mtimeMs; setButtons(); refreshFiles();
});

const remove = guard(async () => {
  if (!confirm(`Delete ${current.path}? This cannot be undone.`)) return;
  await api("DELETE", fileUrl(current.path));
  current = null; savedText = ""; editor.setValue(""); setButtons(); renderOutline(); showValidation(null); refreshFiles(); setTab("files");
  toast("Deleted");
});

const reload = guard(async () => {
  if (isDirty() && !confirm("Discard unsaved changes?")) return;
  const p = current.path; current = null; await openFile(p);
});

function format() {
  try { editor.setValue(JSON.stringify(JSON.parse(editor.getValue()), null, 2) + "\n"); }
  catch (e) { toast("Cannot format: " + e.message); }
}

// ── Garmin actions (upload / schedule / send to watch) ─────────────────
const GARMIN_ACTIONS = { gUpload: "upload", gSchedule: "schedule", gBoth: "upload_schedule", gSend: "send" };
const ACTION_LABEL = { upload: "Upload", schedule: "Schedule", upload_schedule: "Upload + schedule", send: "Send to watch" };

async function loadGarmin() {
  try { garmin = await api("GET", "/api/garmin"); } catch { return; }
  const sel = $("profile"); sel.innerHTML = "";
  for (const name of garmin.profiles) sel.add(new Option(name, name));
  if (garmin.defaultProfile) sel.value = garmin.defaultProfile;
  setButtons();
  if (garmin.user && !garmin.user.admin) refreshFiles();
  refreshSync();
}

function showActivity(title, cls, lines, log) {
  const el = $("activity"); el.innerHTML = "";
  const head = document.createElement("div"); head.className = "msg " + cls; head.textContent = title; el.append(head);
  for (const l of lines || []) { const d = document.createElement("div"); d.className = "msg"; d.textContent = l; el.append(d); }
  if (log) { const pre = document.createElement("pre"); pre.textContent = log; el.append(pre); }
}

function summaryOf(action, r) {
  const res = r.result || {};
  if (action === "upload") return [`${res.successful} uploaded, ${res.failed} failed` + (res.failedWorkouts?.length ? ": " + res.failedWorkouts.join(", ") : "")];
  if (action === "schedule") return [`${res.attempted?.length ?? 0} date(s) attempted`];
  if (action === "upload_schedule") return [`${(res.workouts || []).filter((w) => w.uploaded).length}/${(res.workouts || []).length} workouts uploaded` + (res.writtenBack ? "; new ids saved to the file" : "")];
  return [`Requested: ${(res.requested || []).join(", ")}`];
}

async function garminRun(action) {
  if (!current || garminBusy) return;
  // The actions work on the file on disk, so save first.
  if (isDirty()) {
    if (!confirm("Save your changes before running this on Garmin?")) return;
    await save();
    if (isDirty()) return;
  }
  const validation = (await api("POST", "/api/validate", { text: editor.getValue() })).validation;
  if (validation && validation.errors.length && action.startsWith("upload")) {
    showValidation(validation); setTab("problems");
    return toast(`Fix the ${validation.errors.length} validation error(s) before uploading.`, 6000);
  }
  const list = workoutsOf(parsed()) || [];
  const profile = planProfile();
  const withId = list.filter((w) => w && w.workoutId !== undefined).length;
  const dates = list.reduce((n, w) => n + (w && w.scheduledDate !== undefined ? [].concat(w.scheduledDate).length : 0), 0);
  const flagged = list.filter((w) => w && w.sendToDevice);
  const lines = [`${ACTION_LABEL[action]} — ${current.path}`, `Garmin profile: ${profile}`, ""];
  if (action !== "schedule" && action !== "send") {
    lines.push(`Uploads ${list.length} workout(s). ${withId} already have a workoutId and will be DELETED and RECREATED on Garmin; the new ids are saved into this file.`);
  }
  if (action === "schedule" || action === "upload_schedule") {
    lines.push(`Schedules ${dates} date(s) on the Garmin calendar` + (action === "schedule" ? " using existing workoutIds (workouts without one are skipped)." : "."));
  }
  if (action === "send") {
    lines.push(`Sends ${(flagged.length || list.length)} workout(s)` + (flagged.length ? ' flagged "sendToDevice"' : " (none flagged, so all)") + ` to your watch. Workouts without a workoutId are skipped (${list.length - withId} without).`);
  }
  if (validation && validation.warnings.length) lines.push("", `${validation.warnings.length} validation warning(s) — see Checks.`);
  lines.push("", "This changes your Garmin account. Continue?");
  if (!confirm(lines.join("\n"))) return;

  let deviceId;
  if (action === "send") {
    const q = new URLSearchParams({ path: current.path }); if (profile) q.set("profile", profile);
    const devices = (await api("GET", "/api/garmin/devices?" + q)).devices || [];
    if (devices.length > 1) {
      const pick = prompt("Send to which device?\n" + devices.map((d, i) => `${i + 1}) ${d.displayName}`).join("\n"), "1");
      const d = devices[Number(pick) - 1];
      if (!d) return;
      deviceId = d.deviceId;
    }
  }

  garminBusy = true; setButtons();
  toast(`${ACTION_LABEL[action]}… this can take a minute.`, 60000);
  try {
    const r = await api("POST", "/api/garmin/action", { action, path: current.path, profile, deviceId, confirm: true });
    showActivity(`✓ ${ACTION_LABEL[action]} (${r.profile})`, "ok", summaryOf(action, r), r.log);
    toast(`${ACTION_LABEL[action]} done`);
    await reloadFromDisk(r.mtimeMs);
  } catch (e) {
    const d = e.data || {};
    showActivity(`✗ ${ACTION_LABEL[action]} failed`, "err", [e.message, ...(d.errors || [])], d.log);
    toast(e.message, 8000);
    await reloadFromDisk(d.mtimeMs);
  } finally {
    garminBusy = false; setButtons(); setTab("problems");
    refreshSync(true);
  }
}

/** Uploads write new workoutIds into the file: pull them into the editor when it changed on disk. */
async function reloadFromDisk(mtimeMs) {
  if (!current || mtimeMs === undefined || mtimeMs === current.mtimeMs) return;
  const top = editor.getScrollTop(), p = current.path;
  current = null; await openFile(p); editor.setScrollTop(top);
}

// ── Validation + outline ───────────────────────────────────────────────
function showValidation(v, parseError) {
  const el = $("problems"); el.innerHTML = "";
  const add = (cls, text) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; el.append(d); };
  const errors = parseError ? 1 : v ? v.errors.length : 0, warnings = v ? v.warnings.length : 0;
  $("badge").textContent = errors + warnings || ""; $("badge").classList.toggle("err", errors > 0);
  if (parseError) add("err", parseError);
  else if (!v) add("ok", "Valid JSON (not a workout file, no further checks).");
  else {
    v.errors.forEach((m) => add("err", m));
    v.warnings.forEach((m) => add("warn", m));
    if (v.valid && !v.warnings.length) add("ok", `Valid — ${v.workoutCount} workouts.`);
  }
}

async function runValidate() {
  if (!current) return;
  try { showValidation((await api("POST", "/api/validate", { text: editor.getValue() })).validation); }
  catch (e) { showValidation(null, e.message); }
}

function parsed() { try { return JSON.parse(editor.getValue()); } catch { return null; } }
const workoutsOf = (d) => (Array.isArray(d) ? d : d && Array.isArray(d.workouts) ? d.workouts : null);

function newWorkout(name) {
  return { workoutName: name, workoutType: "strength_training", description: "", sendToDevice: true,
    steps: [{ stepType: "interval", targetType: "no.target", endCondition: "reps", endConditionValue: 10, reps: 10, exerciseName: "BARBELL_BENCH_PRESS", stepOrder: 1 }] };
}

function mutate(fn) {
  const data = parsed(); const list = workoutsOf(data);
  if (!list) return toast("Fix the JSON first.");
  fn(list);
  editor.executeEdits("outline", [{ range: editor.getModel().getFullModelRange(), text: JSON.stringify(data, null, 2) + "\n" }]);
  editor.pushUndoStop();
}

// ── Is each workout up to date on Garmin? (checked against the editor's text, unsaved edits included) ──
let sync = null;   // { path, sigs: JSON of each workout when asked, statuses, error? }
let syncSeq = 0, syncTimer;

// [glyph, class, tooltip]; the bar above the list spells the glyphs out
const SYNC_CHIPS = {
  synced: ["✓", "ok", "Up to date on Garmin"],
  modified: ["≠", "warn", "Differs from the copy on Garmin"],
  "not-uploaded": ["○", "", "No workoutId yet: not on Garmin"],
  missing: ["✗", "err", "Has a workoutId, but Garmin has no such workout"],
  error: ["?", "err", "Could not check against Garmin"],
};

function scheduleSync() {
  clearTimeout(syncTimer);
  if (current && garmin.enabled) syncTimer = setTimeout(() => refreshSync(), 1500);
}

async function refreshSync(force = false) {
  clearTimeout(syncTimer);
  const list = current && garmin.enabled && workoutsOf(parsed());
  const seq = ++syncSeq;
  if (!list) { sync = null; return renderOutline(); }
  const text = editor.getValue(), path = current.path, sigs = list.map((w) => JSON.stringify(w));
  try {
    const r = await api("POST", "/api/garmin/status", { path, text, profile: planProfile(), refresh: force });
    if (seq === syncSeq) sync = { path, sigs, statuses: r.statuses };
  } catch (e) {
    if (seq === syncSeq) sync = { path, sigs, statuses: [], error: e.message };
  }
  if (seq === syncSeq) renderOutline();
}

function syncOf(i, w) {
  if (!sync || !current || sync.path !== current.path || sync.sigs[i] !== JSON.stringify(w)) return null;
  return sync.statuses.find((s) => s.index === i) || null;
}

function renderSyncBar(list) {
  const bar = $("syncbar");
  bar.hidden = !(garmin.enabled && current && list);
  if (bar.hidden) return;
  const counts = {};
  list.forEach((w, i) => { const s = syncOf(i, w); if (s) counts[s.state] = (counts[s.state] || 0) + 1; });
  const words = { synced: "up to date", modified: "differ", "not-uploaded": "not uploaded", missing: "missing", error: "unchecked" };
  const parts = Object.entries(counts).map(([state, n]) => `${SYNC_CHIPS[state][0]} ${n} ${words[state]}`);
  $("syncSummary").textContent = sync?.error ? "Garmin: " + sync.error : parts.length ? "Garmin: " + parts.join(" · ") : "Garmin: checking…";
}

/** Put the editor's cursor on a workout of the open plan. */
function revealWorkout(w) {
  setTab("editor"); editor.layout();
  const m = editor.getModel().findMatches('"workoutName"\\s*:\\s*' + JSON.stringify(w.workoutName).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), false, true, true, null, false);
  if (m.length) { editor.revealLineInCenter(m[0].range.startLineNumber); editor.setPosition(m[0].range.getStartPosition()); editor.focus(); }
}

function renderOutline() {
  const el = $("outline"); el.innerHTML = "";
  const list = workoutsOf(parsed());
  renderSyncBar(current && list);
  if (!current || !list) { el.innerHTML = `<div class="empty">${current ? "Not a workout plan." : "Open a plan."}</div>`; return; }
  list.forEach((w, i) => {
    const row = document.createElement("div"); row.className = "row";
    const date = Array.isArray(w?.scheduledDate) ? w.scheduledDate.join(", ") : w?.scheduledDate || "";
    row.innerHTML = `<span class="name"></span><small></small><button title="Duplicate">⧉</button><button title="Delete" class="danger">✕</button>`;
    const [name, small, dup, del] = row.children;
    name.textContent = w?.workoutName ?? "(unnamed)";
    small.textContent = [w?.steps ? w.steps.length + " steps" : "", date, garmin.enabled ? "" : w?.workoutId ? "↑" : ""].filter(Boolean).join(" ");
    if (garmin.enabled) {
      const st = syncOf(i, w), [glyph, cls, tip] = st ? SYNC_CHIPS[st.state] : ["…", "", "Checking against Garmin"];
      const chip = document.createElement(st && st.differences.length ? "button" : "span");
      chip.className = "chip " + cls; chip.textContent = glyph; chip.title = [tip, ...(st?.differences || [])].join("\n");
      if (chip.tagName === "BUTTON") chip.onclick = () => {
        showActivity(`${st.state === "error" ? "?" : "≠"} ${w?.workoutName ?? "(unnamed)"}`, st.state === "error" ? "err" : "warn", st.differences);
        if (mobileQuery.matches) setTab("problems");
      };
      row.prepend(chip);
    }
    name.onclick = () => revealWorkout(w);
    dup.onclick = () => mutate((l) => { const c = structuredClone(l[i]); delete c.workoutId; c.workoutName += " (copy)"; l.splice(i + 1, 0, c); });
    del.onclick = () => confirm(`Remove "${w?.workoutName}" from the plan?`) && mutate((l) => l.splice(i, 1));
    el.append(row);
  });
  const add = document.createElement("div"); add.className = "row";
  add.innerHTML = "<button>+ Add workout</button>";
  add.firstChild.onclick = () => { const n = prompt("Workout name:", "New workout"); if (n) mutate((l) => l.push(newWorkout(n))); };
  el.append(add);
}

// ── Workouts view: the Garmin library next to the plan workouts, with create / edit / delete ──
// Everything here goes through /api/workouts and /api/garmin/workout, which keep the plan files
// and Garmin in step: saving or deleting a workout changes both unless you untick one.
const W = { profile: null, rows: [], truncated: false, selected: null, detail: null, filter: "", run: 0, detailRun: 0 };
const STATE_RANK = { synced: 1, modified: 2, error: 3, missing: 4 };
const ROW_CHIPS = {
  "garmin-only": ["Garmin only", ""], "not-uploaded": ["Not on Garmin", ""], checking: ["Checking…", ""],
  synced: ["✓ Up to date", "ok"], modified: ["≠ Differs", "warn"], missing: ["✗ Missing on Garmin", "err"], error: ["? Can't check", "err"],
};
const isPlanFile = (f) => f.workoutCount != null && !/^data\/[^/]+\/workouts(-raw)?\.json$/.test(f.path);
const planRef = (p) => ({ path: p.path, index: p.index, mtimeMs: p.mtimeMs });
const prettyName = (key) => String(key).toLowerCase().split("_").map((x) => x.charAt(0).toUpperCase() + x.slice(1)).join(" ");
const planName = (path) => path.split("/").pop().replace(/\.json$/, "");
const upcoming = (w) => [].concat((w && w.scheduledDate) || []).filter((d) => d >= new Date().toISOString().slice(0, 10));

function setView(view) {
  document.body.dataset.view = view;
  $("vPlans").setAttribute("aria-pressed", String(view === "plans"));
  $("vWorkouts").setAttribute("aria-pressed", String(view === "workouts"));
  $("tabWorkouts").setAttribute("aria-selected", String(view === "workouts"));
  if (view === "workouts") guard(loadWorkouts)();
  else if (editor) requestAnimationFrame(() => editor.layout());
  navSync();
}

function rowState(row) {
  if (row.state !== "linked") return row.state;
  if (!row.checks || !row.checks.length) return "checking";
  return row.checks.reduce((worst, c) => (STATE_RANK[c.state] > STATE_RANK[worst] ? c.state : worst), "synced");
}

async function loadWorkouts(refresh = false) {
  await garminReady;
  const run = ++W.run, note = $("wNote");
  const sel = $("wProfile");
  if (!sel.options.length) for (const name of garmin.profiles) sel.add(new Option(name, name));
  sel.hidden = !(garmin.user && garmin.user.admin && garmin.profiles.length > 1);
  W.profile = W.profile || garmin.defaultProfile || garmin.profiles[0];
  sel.value = W.profile || "";
  note.hidden = true;
  if (!garmin.enabled) {
    W.rows = []; renderRows();
    note.textContent = garmin.reason || "Garmin is not available."; note.hidden = false;
    return;
  }
  if (!W.rows.length) $("wrows").innerHTML = '<div class="empty">Loading from Garmin…</div>';
  const q = new URLSearchParams({ profile: W.profile }); if (refresh) q.set("refresh", "1");
  let r;
  try { r = await api("GET", "/api/workouts?" + q); }
  catch (e) { if (run === W.run) { W.rows = []; renderRows(); note.textContent = e.message; note.hidden = false; } return; }
  if (run !== W.run) return;
  W.rows = r.rows; W.truncated = r.truncated;
  renderRows();
  const keep = W.rows.find((x) => x.key === W.selected);
  if (!keep) clearDetail();
  checkLinked(run);
}

/** Compare each plan's workouts with Garmin in the background; the chips fill in as the answers arrive. */
async function checkLinked(run) {
  const byPath = new Map();
  for (const row of W.rows) {
    if (row.state !== "linked") continue;
    for (const p of row.plans) { if (!byPath.has(p.path)) byPath.set(p.path, []); byPath.get(p.path).push([row, p.index]); }
  }
  for (const [path, items] of byPath) {
    if (run !== W.run) return;
    let statuses = [], failure = null;
    try { statuses = (await api("POST", "/api/garmin/status", { path, profile: W.profile })).statuses; }
    catch (e) { failure = e.message; }
    if (run !== W.run) return;
    for (const [row, index] of items) {
      const s = statuses.find((x) => x.index === index) || { index, state: "error", differences: [failure || "Not checked"] };
      (row.checks ||= []).push({ path, ...s });
    }
    renderRows();
  }
}

function renderRows() {
  const el = $("wrows"); el.innerHTML = "";
  const f = W.filter.trim().toLowerCase();
  const rows = W.rows.filter((r) => !f || [r.workoutName, r.workoutType, ...r.plans.map((p) => p.path)].join(" ").toLowerCase().includes(f));
  for (const r of rows) {
    const d = document.createElement("div");
    d.className = "wrow" + (r.key === W.selected ? " active" : "");
    d.innerHTML = '<span class="n"></span><span class="chip"></span><small></small><span class="wact"></span>';
    const [n, chip, small, acts] = d.children;
    n.textContent = r.workoutName;
    const [label, cls] = ROW_CHIPS[rowState(r)];
    chip.textContent = label; chip.className = "chip " + cls;
    small.textContent = [r.workoutType, r.updatedDate && /^\d{4}-/.test(r.updatedDate) ? "updated " + r.updatedDate.slice(0, 10) : "", ...[...new Set(r.plans.map((p) => planName(p.path)))]].filter(Boolean).join(" · ");
    for (const a of rowActions(r)) {
      const b = document.createElement("button");
      b.innerHTML = ICONS[a.icon]; b.title = a.title; b.setAttribute("aria-label", a.title); b.disabled = !a.enabled;
      if (a.danger) b.className = "danger";
      b.onclick = (e) => { e.stopPropagation(); guard(() => withRow(r.key, a.run))(); };
      acts.append(b);
    }
    d.onclick = guard(() => selectRow(r.key));
    el.append(d);
  }
  if (!rows.length && $("wNote").hidden) el.innerHTML = `<div class="empty">${W.rows.length ? "No match." : "No workouts."}</div>`;
  if (W.truncated && !f) { const t = document.createElement("div"); t.className = "empty"; t.textContent = "Garmin lists only the 100 most recently updated workouts."; el.append(t); }
}

function clearDetail() {
  W.selected = null; W.detail = null; W.detailRun++;
  $("wTitle").textContent = "Workout"; $("wEdit").disabled = $("wDelete").disabled = true;
  $("wbody").innerHTML = '<div class="empty">Select a workout.</div>';
  showWorkoutList();
}

/** show=false loads the workout without opening the detail pane (the row buttons use that). */
async function selectRow(key, show = true) {
  const row = W.rows.find((r) => r.key === key);
  if (!row) return;
  W.selected = key;
  if (show) { document.body.dataset.wpane = "detail"; navSync(); }
  renderRows();
  const token = ++W.detailRun;
  $("wTitle").textContent = row.workoutName; $("wEdit").disabled = $("wDelete").disabled = true;
  $("wbody").innerHTML = '<div class="empty">Loading…</div>';
  let garminWorkout = null, plans = [];
  try {
    if (row.workoutId != null) {
      try {
        const r = await api("GET", "/api/garmin/workout?" + new URLSearchParams({ id: row.workoutId, profile: W.profile }));
        garminWorkout = r.workout; plans = r.plans;
      } catch (e) { if (!/not found/i.test(e.message)) throw e; }
    }
    if (!garminWorkout) {
      // Not on Garmin (yet): show the plan's version instead.
      for (const p of row.plans) {
        const f = await api("GET", fileUrl(p.path));
        const w = (workoutsOf(JSON.parse(f.text)) || [])[p.index];
        if (w) plans.push({ path: p.path, index: p.index, mtimeMs: f.mtimeMs, workout: w, differences: [] });
      }
    }
  } catch (e) {
    if (token === W.detailRun) $("wbody").innerHTML = "";
    if (token === W.detailRun) { const m = document.createElement("div"); m.className = "msg err"; m.textContent = e.message; $("wbody").append(m); }
    if (!show) throw e;
    return;
  }
  if (token !== W.detailRun) return;
  W.detail = { row, garmin: garminWorkout, plans };
  $("wEdit").disabled = $("wDelete").disabled = !(garminWorkout || plans.length);
  renderDetail();
}

function fmtDuration(s) { const m = Math.floor(s / 60), r = s % 60; return m ? (r ? `${m} min ${r} s` : `${m} min`) : `${s} s`; }

function stepSummary(st) {
  const bits = [];
  const v = st.endConditionValue;
  if (st.endCondition === "reps") bits.push(`${v} reps`);
  else if (st.endCondition === "time") bits.push(fmtDuration(v));
  else if (st.endCondition === "distance") bits.push(v >= 1000 ? `${+(v / 1000).toFixed(2)} km` : `${v} m`);
  else if (st.endCondition === "lap.button") bits.push("until lap button");
  else if (st.endCondition) bits.push(`${st.endCondition} ${v ?? ""}`.trim());
  if (st.weight) bits.push(`@ ${st.weight} lb`);
  if (st.weightPercentage) bits.push(`@ ${st.weightPercentage}% of ${prettyName(st.benchmarkKey || "1RM")}`);
  if (st.targetType && st.targetType !== "no.target") bits.push(`${st.targetType.replace(/\.zone$/, "")} ${st.targetValueOne ?? ""}${st.targetValueTwo ? "–" + st.targetValueTwo : ""}`.trim());
  if (st.restTimeSeconds) bits.push(`rest ${fmtDuration(st.restTimeSeconds)}`);
  return bits.join(" · ");
}

function stepsEl(steps) {
  const ol = document.createElement("ol"); ol.className = "steps";
  const item = (st) => {
    const li = document.createElement("li");
    li.append(st.exerciseName ? prettyName(st.exerciseName) : prettyName(st.stepType));
    const small = document.createElement("small"); small.textContent = stepSummary(st); li.append(small);
    return li;
  };
  for (let i = 0; i < steps.length; i++) {
    const st = steps[i];
    if (st.numberOfRepeats > 1 && st.repeatGroupIndex !== undefined) {
      const g = document.createElement("li"); g.className = "group";
      const head = document.createElement("b"); head.textContent = `Repeat ×${st.numberOfRepeats}`; g.append(head);
      const inner = document.createElement("ol"); inner.className = "steps";
      while (i < steps.length && steps[i].repeatGroupIndex === st.repeatGroupIndex) inner.append(item(steps[i++]));
      i--; g.append(inner); ol.append(g);
    } else ol.append(item(st));
  }
  return ol;
}

function section(title, ...children) {
  const h = document.createElement("h3"); h.textContent = title;
  return [h, ...children];
}

function renderDetail() {
  const d = W.detail, box = $("wbody"); box.innerHTML = "";
  const w = d && (d.garmin || (d.plans[0] && d.plans[0].workout));
  if (!w) { box.innerHTML = '<div class="empty">This workout is no longer in its plan.</div>'; return; }
  $("wTitle").textContent = w.workoutName;
  const add = (...nodes) => nodes.flat().forEach((n) => n && box.append(n));
  const text = (tag, cls, t) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = t; return e; };

  add(text("div", "meta", [w.workoutType, d.garmin ? `Garmin id ${d.garmin.workoutId}` : "", w.description].filter(Boolean).join(" · ")));

  // Status against the plan
  const banner = document.createElement("div");
  const differing = d.plans.filter((p) => p.differences.length);
  if (!d.garmin && d.plans.some((p) => p.workout.workoutId != null)) {
    banner.className = "banner err"; banner.append(text("div", "", "✗ The plan has a workoutId, but Garmin has no such workout."));
  } else if (!d.garmin) {
    banner.className = "banner"; banner.append(text("div", "", "Not on Garmin yet."));
  } else if (!d.plans.length) {
    banner.className = "banner"; banner.append(text("div", "", "Only on Garmin: no plan file carries this workout."));
  } else if (differing.length) {
    banner.className = "banner warn"; banner.append(text("div", "", `≠ Differs from ${planName(differing[0].path)}:`));
    const ul = document.createElement("ul"); differing[0].differences.forEach((x) => ul.append(text("li", "", x))); banner.append(ul);
    const btns = document.createElement("div"); btns.className = "btns";
    const push = text("button", "garmin", "↑ Push the plan's version to Garmin"), pull = text("button", "", "↓ Use Garmin's version in the plan");
    push.onclick = guard(() => pushPlanVersion(differing[0])); pull.onclick = guard(() => pullGarminVersion(differing[0]));
    btns.append(push, pull); banner.append(btns);
  } else {
    banner.className = "banner ok"; banner.append(text("div", "", `✓ Up to date with ${[...new Set(d.plans.map((p) => planName(p.path)))].join(", ")}.`));
  }
  add(banner);

  add(section(d.garmin ? "Steps on Garmin" : "Steps in the plan", w.steps && w.steps.length ? stepsEl(w.steps) : text("div", "meta", w.distanceMeters ? `${w.distanceMeters / 1000} km, no steps` : "No steps")));
  if (d.garmin && differing.length && differing[0].workout.steps) {
    const det = document.createElement("details"); det.className = "plan-version";
    det.append(text("summary", "", `Steps in ${planName(differing[0].path)}`), stepsEl(differing[0].workout.steps));
    add(det);
  }

  if (d.plans.length) {
    const list = document.createElement("div"); list.className = "plans";
    for (const p of d.plans) {
      const line = document.createElement("div"), a = text("a", "", `${p.path} #${p.index + 1}`);
      a.onclick = guard(() => openPlanWorkout(p.path, p.workout));
      line.append(a); list.append(line);
    }
    add(section("In plans", list));
  }
}

async function openPlanWorkout(path, w) {
  setView("plans");
  if (!current || current.path !== path) await openFile(path);
  setTab("editor"); revealWorkout(w);
}

const ICONS = {
  upload: '<svg viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  download: '<svg viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>',
  clone: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  delete: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',

/** Upload puts the plan's version on Garmin; download brings Garmin's version into a plan. Each is offered only when it would change something. */
function rowActions(row) {
  const st = rowState(row);
  const why = { synced: "already up to date", checking: "still checking", error: "could not be checked" };
  const up = ["modified", "not-uploaded", "missing"].includes(st), down = ["modified", "garmin-only"].includes(st);
  return [
    { icon: "upload", enabled: up, run: uploadRow, title: up ? "Upload the plan's version to Garmin" : `Upload: ${why[st] || "only on Garmin, no plan has it"}` },
    { icon: "download", enabled: down, run: downloadRow, title: !down ? `Download: ${why[st] || "not on Garmin"}` : st === "garmin-only" ? "Download into a plan" : "Download Garmin's version into the plan" },
    { icon: "clone", enabled: true, run: cloneRow, title: "Clone" },
    { icon: "delete", enabled: true, run: deleteSelected, title: "Delete", danger: true },
  ];
}

/** Load a row's workout (without opening it), then run an action on the loaded detail. */
async function withRow(key, action) {
  await selectRow(key, false);
  const d = W.detail;
  if (d && d.row.key === key) await action(d);
}

const uploadRow = async (d) => {
  const p = d.plans.find((x) => x.differences.length) || d.plans[0];
  if (!p) throw new Error("Only on Garmin: no plan has this workout.");
  if (d.garmin) return pushPlanVersion(p);
  const schedule = upcoming(p.workout).length > 0;
  if (!confirmUpload(p.workout, { replacing: false, plans: d.plans, schedule })) return; // not on Garmin (yet): a new upload
  const r = await api("PUT", "/api/garmin/workout", { workoutId: p.workout.workoutId, workout: p.workout, plans: d.plans.map(planRef), upload: true, schedule, profile: W.profile, confirm: true });
  toast("Uploaded to Garmin");
  await afterChange(r, `g:${r.workoutId}`);
};

const downloadRow = async (d) => {
  const p = d.plans.find((x) => x.differences.length);
  if (p && d.garmin) return pullGarminVersion(p);
  if (!d.garmin || d.plans.length) throw new Error("Nothing to download: the plan already has this workout.");
  // Only on Garmin: add it to a plan, linked to the Garmin workout so a later upload replaces it instead of duplicating it.
  await openWorkoutDialog("new", { ...d.garmin }, { title: `Download "${d.garmin.workoutName}" into a plan`, link: d.garmin.workoutId });
};

const cloneRow = async (d) => {
  const copy = structuredClone(d.plans.length ? d.plans[0].workout : d.garmin);
  delete copy.workoutId; delete copy.scheduledDate; // a copy is its own workout, and not yet on the calendar
  copy.workoutName = `${copy.workoutName} (copy)`;
  await openWorkoutDialog("new", copy, { title: "Clone workout", planPath: d.plans.length ? d.plans[0].path : "" });
};

/** A modal with checkboxes. Resolves to { id: checked } when confirmed, or null when cancelled. */
function askDialog({ title, text, options = [], ok = "OK", danger = false }) {
  const dlg = $("dlg");
  $("dlgTitle").textContent = title; $("dlgText").textContent = text || "";
  const opts = $("dlgOpts"); opts.innerHTML = "";
  const boxes = options.map((o) => {
    const label = document.createElement("label"), cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!o.checked; label.append(cb, o.label); opts.append(label);
    return [o.id, cb];
  });
  $("dlgOk").textContent = ok; $("dlgOk").className = danger ? "danger" : "primary";
  return new Promise((resolve) => {
    const done = (value) => { dlg.close(); $("dlgOk").onclick = $("dlgCancel").onclick = dlg.onclose = null; resolve(value); };
    $("dlgOk").onclick = () => done(Object.fromEntries(boxes.map(([id, cb]) => [id, cb.checked])));
    $("dlgCancel").onclick = () => done(null);
    dlg.onclose = () => resolve(null); // Escape
    dlg.showModal(); navDialog(dlg);
  });
}

let dlgEditor, dlgMode = null, dlgLink = null, dlgSaving = false;

function ensureDialogEditor() {
  if (dlgEditor) return;
  dlgEditor = monaco.editor.create($("wdEditor"), {
    model: monaco.editor.createModel("", "json", monaco.Uri.parse(WORKOUT_URI)), theme: "vs-dark", automaticLayout: true,
    minimap: { enabled: false }, tabSize: 2, scrollBeyondLastLine: false, ...monacoLayoutOptions(),
  });
  let timer;
  dlgEditor.onDidChangeModelContent(() => { clearTimeout(timer); timer = setTimeout(checkDialog, 500); updateScheduleBox(); });
  dlgEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => guard(saveDialog)());
}

function dialogWorkout() {
  try {
    const w = JSON.parse(dlgEditor.getValue());
    return w && typeof w === "object" && !Array.isArray(w) ? { workout: w } : { error: "Expected one workout object." };
  } catch (e) { return { error: "Not valid JSON: " + e.message }; }
}

function showDialogProblems(lines, cls = "err") {
  const el = $("wdProblems"); el.innerHTML = "";
  for (const [c, t] of lines.map((x) => (Array.isArray(x) ? x : [cls, x]))) { const d = document.createElement("div"); d.className = "msg " + c; d.textContent = t; el.append(d); }
}

async function checkDialog() {
  const { workout, error } = dialogWorkout();
  if (error) return showDialogProblems([error]);
  try {
    const v = (await api("POST", "/api/validate", { text: JSON.stringify([workout]) })).validation;
    showDialogProblems([...v.errors.map((m) => ["err", m]), ...v.warnings.map((m) => ["warn", m])]);
  } catch (e) { showDialogProblems([e.message]); }
}

function updateScheduleBox() {
  const { workout } = dialogWorkout();
  const dates = workout ? upcoming(workout) : [];
  $("wdScheduleRow").hidden = !dates.length || !$("wdUpload").checked;
}

/**
 * mode: "new" | "edit"; workout: what to show in the editor.
 * opts: title; planPath (plan preselected in "new"); link (the Garmin workoutId when the workout is already on Garmin: it is only added to a plan, linked).
 */
async function openWorkoutDialog(mode, workout, opts = {}) {
  if (!monaco) throw new Error("The editor is still loading. Try again in a moment.");
  ensureDialogEditor();
  dlgMode = mode; dlgLink = opts.link ?? null; showDialogProblems([]);
  const d = W.detail;
  const garminOnly = mode === "edit" && d.garmin && !d.plans.length;
  $("wdTitle").textContent = opts.title || (mode === "new" ? "New workout" : `Edit — ${workout.workoutName}`);
  $("wdPlanRow").hidden = mode !== "new";
  if (mode === "new") {
    await refreshFiles();
    const sel = $("wdPlan"); sel.innerHTML = "";
    const planFiles = files.filter(isPlanFile);
    if (!opts.link) sel.add(new Option("(none — Garmin only)", ""));
    for (const f of planFiles) sel.add(new Option(f.path, f.path));
    const wanted = opts.planPath ?? (current ? current.path : "");
    sel.value = planFiles.some((f) => f.path === wanted) ? wanted : opts.link && planFiles.length ? planFiles[0].path : "";
  }
  $("wdUploadLabel").textContent = opts.link ? "Already on Garmin: only the plan changes" : mode === "new" ? "Upload to Garmin" : garminOnly ? "Save to Garmin" : "Also update on Garmin (replaces the workout: new id)";
  $("wdUpload").checked = garmin.enabled && !opts.link; $("wdUpload").disabled = garminOnly || !!opts.link;
  $("wdSchedule").checked = true;
  dlgEditor.setValue(JSON.stringify(workout, null, 2) + "\n");
  $("wdlg").showModal(); navDialog($("wdlg"));
  dlgEditor.layout(); updateScheduleBox();
  setTimeout(checkDialog, 0);
}

/** The confirmation text for putting a workout on Garmin; the API insists on it being confirmed. */
function confirmUpload(workout, { replacing, plans, schedule }) {
  const lines = [replacing ? `Replace "${workout.workoutName}" on Garmin?` : `Upload "${workout.workoutName}" to Garmin?`, `Garmin profile: ${W.profile}`, ""];
  if (replacing) lines.push("Garmin deletes the old workout and creates a new one, so its workoutId changes.");
  if (plans.length) lines.push(`${plans.length === 1 ? "The plan entry" : plans.length + " plan entries"} in ${[...new Set(plans.map((p) => p.path))].join(", ")} will get the new id.`);
  lines.push(schedule ? "Its upcoming scheduled dates are added to the Garmin calendar again." : "Its calendar entries are not re-created.");
  lines.push("", "This changes your Garmin account. Continue?");
  return confirm(lines.join("\n"));
}

const saveDialog = async () => {
  if (dlgSaving) return;
  const { workout, error } = dialogWorkout();
  if (error) return showDialogProblems([error]);
  const upload = $("wdUpload").checked, schedule = upload && !$("wdScheduleRow").hidden && $("wdSchedule").checked;
  if (upload) {
    // Refuse before asking for confirmation: the server would reject an invalid workout anyway.
    const v = (await api("POST", "/api/validate", { text: JSON.stringify([workout]) })).validation;
    if (v && v.errors.length) return showDialogProblems([...v.errors.map((m) => ["err", m]), ["warn", "Fix these before uploading, or untick the Garmin box to save only to the plan."]]);
  }
  const d = W.detail, editing = dlgMode === "edit";
  const plans = editing ? d.plans.map(planRef) : [];
  const planPath = !editing && $("wdPlan").value ? $("wdPlan").value : "";
  const replacing = editing && d.garmin && upload;
  if (upload && !confirmUpload(workout, { replacing, plans: editing ? plans : planPath ? [{ path: planPath }] : [], schedule })) return;

  dlgSaving = true; $("wdSave").disabled = true;
  try {
    const profile = W.profile;
    let r;
    if (editing) {
      r = await api("PUT", "/api/garmin/workout", { workoutId: d.garmin ? d.garmin.workoutId : d.row.workoutId, workout, plans, upload, schedule, profile, confirm: upload });
    } else {
      const file = planPath ? files.find((f) => f.path === planPath) : null;
      r = await api("POST", "/api/garmin/workout", { workout, planPath, mtimeMs: file && file.mtimeMs, upload, schedule, profile, confirm: upload, linkWorkoutId: dlgLink ?? undefined });
    }
    $("wdlg").close();
    toast(upload ? "Saved and uploaded to Garmin" : "Saved to the plan");
    const key = r.workoutId != null ? `g:${r.workoutId}` : editing ? W.selected : r.path ? `p:${r.path}#${r.index}` : null;
    await afterChange(r, key);
  } catch (e) {
    showDialogProblems([e.message, ...((e.data && e.data.errors) || [])]);
  } finally { dlgSaving = false; $("wdSave").disabled = false; }
};

/** Reload the list after a change and bring the open plan up to date. */
async function afterChange(result, selectKey) {
  const wasSelected = W.selected;
  W.selected = selectKey; W.detail = null;
  await loadWorkouts(true);
  // Stay on the list when a row button started this (mobile shows one pane at a time).
  if (selectKey && W.rows.some((r) => r.key === selectKey)) await selectRow(selectKey, document.body.dataset.wpane === "detail");
  else if (!W.rows.some((r) => r.key === wasSelected)) clearDetail();
  for (const c of result.changed || []) {
    if (!current || current.path !== c.path) continue;
    if (isDirty()) toast(`${c.path} changed on disk: reload it in the Plans view before saving.`, 8000);
    else await reloadFromDisk(c.mtimeMs);
  }
  refreshFiles();
}

const pushPlanVersion = async (p) => {
  const d = W.detail, workout = p.workout;
  const schedule = upcoming(workout).length > 0;
  if (!confirmUpload(workout, { replacing: true, plans: d.plans, schedule })) return;
  const r = await api("PUT", "/api/garmin/workout", { workoutId: d.garmin.workoutId, workout, plans: d.plans.map(planRef), upload: true, schedule, profile: W.profile, confirm: true });
  toast("Garmin now has the plan's version");
  await afterChange(r, `g:${r.workoutId}`);
};

const pullGarminVersion = async (p) => {
  const d = W.detail;
  if (!confirm(`Replace "${d.garmin.workoutName}" in ${p.path} with the version from Garmin?\n\nIts scheduledDate and sendToDevice stay as they are. This only changes the plan file.`)) return;
  const workout = { ...d.garmin };
  for (const k of ["scheduledDate", "sendToDevice", "distanceMeters"]) if (p.workout[k] !== undefined) workout[k] = p.workout[k];
  const r = await api("PUT", "/api/garmin/workout", { workoutId: d.garmin.workoutId, workout, plans: [planRef(p)] });
  toast("The plan now has Garmin's version");
  await afterChange(r, W.selected);
};

const deleteSelected = async () => {
  const d = W.detail; if (!d) return;
  const name = (d.garmin || d.plans[0].workout).workoutName;
  const where = [...new Set(d.plans.map((p) => p.path))];
  const options = [];
  if (d.garmin) options.push({ id: "garmin", label: `Delete from Garmin (profile ${W.profile})`, checked: true });
  if (where.length) options.push({ id: "plans", label: `Remove from the plan${where.length > 1 ? "s" : ""}: ${where.join(", ")}`, checked: !d.garmin });
  const answer = await askDialog({
    title: `Delete "${name}"`, ok: "Delete", danger: true, options,
    text: d.garmin && where.length ? "Tick what to delete. If you keep it in the plan, it stays there as a workout that is not on Garmin." : "This cannot be undone.",
  });
  if (!answer) return;
  if (!answer.garmin && !answer.plans) return toast("Nothing selected.");
  const r = await api("DELETE", "/api/garmin/workout", { workoutId: d.garmin ? d.garmin.workoutId : d.row.workoutId, plans: d.plans.map(planRef), garmin: !!answer.garmin, removeFromPlans: !!answer.plans, profile: W.profile, confirm: true });
  toast("Deleted");
  clearDetail();
  await afterChange(r, null);
};

function bindWorkoutsView() {
  $("vPlans").onclick = () => setView("plans"); $("vWorkouts").onclick = () => setView("workouts");
  $("tabWorkouts").onclick = () => setView("workouts");
  $("wRefresh").onclick = guard(() => loadWorkouts(true));
  $("wProfile").onchange = guard(() => { W.profile = $("wProfile").value; W.rows = []; clearDetail(); return loadWorkouts(); });
  $("wFilter").oninput = () => { W.filter = $("wFilter").value; renderRows(); };
  $("wBackList").onclick = showWorkoutList;
  $("wNew").onclick = guard(() => openWorkoutDialog("new", newWorkout("New workout")));
  $("wEdit").onclick = guard(() => { const d = W.detail; return d && openWorkoutDialog("edit", d.plans.length ? d.plans[0].workout : d.garmin); });
  $("wDelete").onclick = guard(deleteSelected);
  $("wdSave").onclick = guard(saveDialog); $("wdCancel").onclick = $("wdClose").onclick = () => $("wdlg").close();
  $("wdUpload").onchange = updateScheduleBox;
}

const MONACO_BASE = location.origin + "/vendor/monaco/";
// The two editors (plan file, single workout) are told apart by model URI so each gets its own JSON schema.
const PLAN_URI = "plan://editor/plan.json", WORKOUT_URI = "workout://editor/workout.json";
require.config({ paths: { vs: "/vendor/monaco" } });
// Workers can't resolve a relative base URL, so bootstrap them through a blob with absolute paths.
self.MonacoEnvironment = {
  getWorkerUrl: () => URL.createObjectURL(new Blob(
    [`self.MonacoEnvironment={baseUrl:${JSON.stringify(MONACO_BASE)}};importScripts(${JSON.stringify(MONACO_BASE + "base/worker/workerMain.js")});require.config({paths:{vs:${JSON.stringify(MONACO_BASE.slice(0, -1))}}});`],
    { type: "text/javascript" })),
};
function monacoLayoutOptions() {
  return mobileQuery.matches
    ? { fontSize: 14, wordWrap: "on", lineNumbers: "off", glyphMargin: false, lineDecorationsWidth: 6, renderLineHighlight: "none", padding: { top: 8, bottom: 8 }, scrollbar: { verticalScrollbarSize: 8 } }
    : { fontSize: 13, wordWrap: "off", lineNumbers: "on", glyphMargin: true, lineDecorationsWidth: 10, renderLineHighlight: "line", padding: { top: 0, bottom: 0 }, scrollbar: { verticalScrollbarSize: 14 } };
}
require(["vs/editor/editor.main"], async (m) => {
  monaco = m;
  editor = monaco.editor.create($("editor"), {
    model: monaco.editor.createModel("", "json", monaco.Uri.parse(PLAN_URI)), theme: "vs-dark", automaticLayout: true,
    minimap: { enabled: false }, tabSize: 2, formatOnPaste: true, scrollBeyondLastLine: false,
    ...monacoLayoutOptions(),
  });
  mobileQuery.addEventListener("change", () => editor.updateOptions(monacoLayoutOptions()));
  // The on-screen keyboard needs the room: hide the tab bar while typing.
  editor.onDidFocusEditorText(() => document.body.classList.toggle("kbd", mobileQuery.matches));
  editor.onDidBlurEditorText(() => document.body.classList.remove("kbd"));
  try {
    const schema = await api("GET", "/api/schema");
    const workoutSchema = (schema.oneOf.find((x) => x.type === "array") || {}).items;
    monaco.languages.json.jsonDefaults.setDiagnosticsOptions({
      validate: true, allowComments: false,
      schemas: [
        { uri: "plan-schema.json", fileMatch: [PLAN_URI], schema },
        ...(workoutSchema ? [{ uri: "workout-schema.json", fileMatch: [WORKOUT_URI], schema: workoutSchema }] : []),
      ],
    });
  } catch {}
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, save);
  editor.onDidChangeModelContent(() => {
    setButtons(); renderOutline(); scheduleSync();
    clearTimeout(validateTimer); validateTimer = setTimeout(runValidate, 600);
  });
  $("save").onclick = save; $("new").onclick = newFile; $("validate").onclick = runValidate;
  $("format").onclick = format; $("reload").onclick = reload; $("dup").onclick = duplicate;
  $("rename").onclick = rename; $("delete").onclick = remove;
  $("menu").onclick = toggleMenu;
  for (const [id, action] of Object.entries(GARMIN_ACTIONS)) $(id).onclick = guard(() => garminRun(action));
  $("actions").addEventListener("click", (e) => e.target.closest("button") && document.body.classList.remove("menu-open"));
  document.querySelectorAll("#tabbar button[data-tab]").forEach((b) => (b.onclick = () => { setView("plans"); setTab(b.dataset.tab); }));
  $("syncRefresh").onclick = guard(() => refreshSync(true));
  $("profile").onchange = () => refreshSync(true);
  window.addEventListener("beforeunload", (e) => { if (isDirty()) e.preventDefault(); });
});
setTab("files");
guard(refreshFiles)();
const garminReady = loadGarmin(); // the Workouts view waits for it
bindWorkoutsView();
</script>
</body>
</html>
