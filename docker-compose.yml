# MCP server for claude.ai / Claude Desktop, plus the plan editor web UI.
#
#   1. From a checkout of the repo (profiles, plans and data live in ./data/garmin.db, created on first start):
#      mkdir -p data
#   2. echo "MCP_AUTH_TOKEN=$(openssl rand -hex 32)" >> .env     # compose reads .env
#      echo "WEB_AUTH_TOKEN=$(openssl rand -hex 16)" >> .env     # plan editor password
#      echo "CREDENTIALS_KEY=$(openssl rand -hex 32)" >> .env    # encrypts the saved Garmin / Renpho passwords; keep it with the deployment
#   3. docker compose up -d --build
#   4. Open the plan editor and add a profile (a name and its sign-in password). Garmin and a Renpho scale are optional and connected in Settings.
#   5. (optional public URL)  docker compose --profile tunnel up -d
#
# Upgrading from the old .env.<profile> files (./config): run once, with the files still mounted at /config,
#   docker compose run --rm -v ./config:/config:ro garmin-mcp node dist/storeCli.js import-env /config
#
# Add the connector with the URL  https://<your-host>/mcp/<MCP_AUTH_TOKEN>
# Plan editor: http://<host>:8788  (sign-in form: any user name + WEB_AUTH_TOKEN, or a profile name + its web sign-in password)

services:
  garmin-mcp:
    build: .
    image: garmin-workout-editor-mcp:latest
    container_name: garmin-mcp
    restart: unless-stopped
    # Run as the owner of ./data (Synology/QNAP users are rarely uid 1000).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env (openssl rand -hex 32)}
      GARMIN_PROFILE: ${GARMIN_PROFILE:-}
      # encrypts the saved Garmin and Renpho passwords in garmin.db; the same value in garmin-web below (empty: stored as plain text)
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      TZ: ${TZ:-}                      # your time zone, for "today" (needed for a profile without Garmin)
    ports:
      # Loopback by default: a reverse proxy on the NAS (or the tunnel below) reaches it.
      # Set MCP_BIND=0.0.0.0 to also allow LAN clients.
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8787}:8787"
    volumes:
      - ./data:/data                   # garmin.db: profiles, plans and data, food, activities, logins, Garmin tokens

  # Plan editor (Monaco JSON editor + CRUD on the stored plans, plus upload / schedule / send
  # buttons for the profiles that have a Garmin login). Same image as garmin-mcp.
  garmin-web:
    image: garmin-workout-editor-mcp:latest
    container_name: garmin-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["node", "dist/web/server.js"]
    environment:
      WEB_AUTH_TOKEN: ${WEB_AUTH_TOKEN:?Set WEB_AUTH_TOKEN in .env (openssl rand -hex 16)}
      GARMIN_PROFILE: ${GARMIN_PROFILE:-}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      # behind the Cloudflare tunnel or a reverse proxy: which header names the visitor, so the wrong-password limit counts each one
      # apart (cloudflare, or proxy for X-Forwarded-For). Empty: the connection's own address, which behind a proxy is the proxy's.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # the Food view's AI box: empty means it is off (the page says how to set it up)
      FOOD_AI_BACKEND: ${FOOD_AI_BACKEND:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FOOD_AI_MODEL: ${FOOD_AI_MODEL:-}
      FOOD_AI_DAILY_LIMIT: ${FOOD_AI_DAILY_LIMIT:-}
      TZ: ${TZ:-}
    ports:
      # Loopback by default; set WEB_BIND=0.0.0.0 to allow LAN clients.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8788}:8788"
    volumes:
      - ./data:/data                   # the same database as garmin-mcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - garmin-mcp   # builds the shared image

  # Optional: stable public HTTPS hostname through a Cloudflare Tunnel.
  # Create the tunnel in the Cloudflare dashboard, point its public hostname at
  # http://garmin-mcp:8787 and put the tunnel token in .env as TUNNEL_TOKEN.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    container_name: garmin-mcp-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Empty default: compose interpolates inactive profiles too, so don't make this required.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - garmin-mcp
