# MCP server for claude.ai / Claude Desktop, plus the plan editor web UI.
#
#   1. From a checkout of the repo (./workout-plans is imported into the database on first start):
#      mkdir -p config data
#      cp .env.MED config/            # one .env.<profile> per Garmin account
#   2. echo "MCP_AUTH_TOKEN=$(openssl rand -hex 32)" >> .env     # compose reads .env
#      echo "WEB_AUTH_TOKEN=$(openssl rand -hex 16)" >> .env     # plan editor password
#   3. docker compose up -d --build
#   4. (optional public URL)  docker compose --profile tunnel up -d
#
# Add the connector with the URL  https://<your-host>/mcp/<MCP_AUTH_TOKEN>
# Plan editor: http://<host>:8788  (any user name, WEB_AUTH_TOKEN as password)

services:
  garmin-mcp:
    build: .
    image: garmin-workout-editor-mcp:latest
    container_name: garmin-mcp
    restart: unless-stopped
    # Run as the owner of ./data (Synology/QNAP users are rarely uid 1000).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env (openssl rand -hex 32)}
      GARMIN_PROFILE: ${GARMIN_PROFILE:-}
    ports:
      # Loopback by default: a reverse proxy on the NAS (or the tunnel below) reaches it.
      # Set MCP_BIND=0.0.0.0 to also allow LAN clients.
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8787}:8787"
    volumes:
      - ./config:/config:ro            # .env.<profile> files (Garmin credentials)
      - ./data:/data                   # garmin.db (plans and data) and the token cache
      - ./workout-plans:/plans:ro      # read once: imported into garmin.db when it is first created; drop it afterwards

  # Plan editor (Monaco JSON editor + CRUD on the stored plans, plus upload / schedule / send
  # buttons). Same image as garmin-mcp; /config is only used by those Garmin buttons.
  garmin-web:
    image: garmin-workout-editor-mcp:latest
    container_name: garmin-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["node", "dist/web/server.js"]
    environment:
      WEB_AUTH_TOKEN: ${WEB_AUTH_TOKEN:?Set WEB_AUTH_TOKEN in .env (openssl rand -hex 16)}
      GARMIN_PROFILE: ${GARMIN_PROFILE:-}
    ports:
      # Loopback by default; set WEB_BIND=0.0.0.0 to allow LAN clients.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8788}:8788"
    volumes:
      - ./config:/config:ro            # same credentials as garmin-mcp (enables the Garmin buttons)
      - ./data:/data
      - ./workout-plans:/plans:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - garmin-mcp   # builds the shared image

  # Optional: stable public HTTPS hostname through a Cloudflare Tunnel.
  # Create the tunnel in the Cloudflare dashboard, point its public hostname at
  # http://garmin-mcp:8787 and put the tunnel token in .env as TUNNEL_TOKEN.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    container_name: garmin-mcp-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Empty default: compose interpolates inactive profiles too, so don't make this required.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - garmin-mcp
